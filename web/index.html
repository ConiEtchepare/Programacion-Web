
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dietética Lo De Kiki - Catálogo</title>
    <!-- Tipografía Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1> Dietética Lo De Kiki 🌿</h1>
        <p>- Gestión del catálogo -</p>
    </header>

    <main class="container">
        <!-- Formulario de creación -->
        <section class="card">
            <h2> Agregar Producto</h2>
            <form id="producto-form">
                <div class="form-group">
                    <label for="nombre">Nombre del Producto:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Castañas de Cajú W4" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria" name="categoria" placeholder="Ej: Frutos Secos" required>
                </div>

                <div class="form-group">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" name="precio" step="0.01" placeholder="Ej: 12500.50" required>
                </div>

                <button type="submit" class="btn-primary">Guardar Producto</button>
            </form>
        </section>

        <!-- Contenedor de lista de productos -->
        <section class="card">
            <h2> Catálogo Actual</h2>
            <ul id="productos-lista" class="lista-productos">
                <!-- Se renderiza dinámicamente -->
            </ul>
        </section>
    </main>

    <!-- Modal de Edición -->
    <div id="modal-editar" class="modal">
        <div class="modal-content card">
            <span class="close-modal">&times;</span>
            <h2> Editar Producto</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-nombre">Nombre del Producto:</label>
                    <input type="text" id="edit-nombre" required>
                </div>
                <div class="form-group">
                    <label for="edit-categoria">Categoría:</label>
                    <input type="text" id="edit-categoria" required>
                </div>
                <div class="form-group">
                    <label for="edit-precio">Precio ($):</label>
                    <input type="number" id="edit-precio" step="0.01" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                    <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
